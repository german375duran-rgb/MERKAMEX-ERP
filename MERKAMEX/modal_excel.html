<style>
.excel-grid {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
    background: #fff;
    color: #000;
}
.excel-grid th {
    background: #f0f0f0;
    border: 1px solid #ccc;
    padding: 8px;
    font-size: 0.8rem;
    text-align: center;
    color: #333;
    position: sticky;
    top: 0;
}
.excel-grid td {
    border: 1px solid #ccc;
    padding: 6px;
    font-size: 0.85rem;
    min-width: 80px;
    outline: none;
    background: #fff;
}
.excel-wrapper {
    max-height: 500px;
    overflow-y: auto;
    overflow-x: auto;
    background: #fff;
    border-radius: 4px;
}
.file-upload-wrapper {
    margin-bottom: 15px;
    padding: 15px;
    background: rgba(0, 150, 94, 0.1);
    border: 1px dashed var(--emerald-green);
    border-radius: 8px;
    text-align: center;
}
</style>

<!-- SheetJS para parseo de Excel -->
<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

<div class="modal-overlay-custom" id="modal-importacion">
    <div class="modal-content" style="max-width: 95vw; width: 1200px;">
        <div class="card-header">
            HOJA DE EXCEL - CARGA MASIVA DE RUTAS
            <button style="background:none; border:none; color:var(--text-main); font-size:1.2rem; cursor:pointer;" onclick="cerrarModal('modal-importacion')">X</button>
        </div>
        
        <div class="file-upload-wrapper">
            <p style="font-size: 0.85rem; color: var(--text-main); margin-bottom: 10px;">
                <strong>Seleccione un archivo de Excel (.xlsx, .csv)</strong> o arrástrelo aquí para cargar las rutas.
            </p>
            <input type="file" id="excel-file-input" accept=".xlsx, .xls, .csv" style="margin: 0 auto; display: block;" onchange="manejarCargaExcel(event)">
        </div>

        <div style="display: flex; gap: 10px; margin-bottom: 10px;">
            <button class="btn btn-primary" onclick="procesarExcelGrid()"><i class="fa-solid fa-save"></i> PROCESAR Y GUARDAR RUTAS</button>
            <button class="btn btn-secondary" onclick="limpiarGrid()"><i class="fa-solid fa-eraser"></i> LIMPIAR HOJA</button>
        </div>

        <div class="excel-wrapper">
            <table class="excel-grid" id="excel-grid-table">
                <thead>
                    <tr>
                        <th>ARTÍCULO</th>
                        <th>SECUENCIA</th>
                        <th>CT</th>
                        <th>CR</th>
                        <th>DESC. CR</th>
                        <th>SETUP</th>
                        <th>TIEMPO</th>
                        <th>UM</th>
                        <th>OPERACIÓN</th>
                    </tr>
                </thead>
                <tbody id="excel-grid-body">
                    <!-- Javascript generates this -->
                </tbody>
            </table>
        </div>
    </div>
</div>
